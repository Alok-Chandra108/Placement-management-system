apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alokchandra7/cpms-frontend:k8s
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer # Exposes the service on localhost:80 in Docker Desktop
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
