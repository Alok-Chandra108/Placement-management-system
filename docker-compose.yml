services:
  backend:
    image: alokchandra7/cpms-backend:k8s
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    networks:
      - cpms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => { (r.statusCode === 200 || r.statusCode === 503) ? process.exit(0) : process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: alokchandra7/cpms-frontend:k8s
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cpms-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - cpms-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - cpms-network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  cpms-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
