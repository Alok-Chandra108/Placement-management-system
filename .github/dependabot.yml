version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for the backend Node.js application
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Maintain dependencies for the frontend Node.js application
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
