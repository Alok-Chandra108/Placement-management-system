# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s --health-timeout=5s --health-retries=5
        tmpfs: [/data/db]
      redis:
        image: redis:alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
        tmpfs: [/data]

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker compose -f docker-compose.ci.yml build backend

      - name: Run tests
        run: |
          docker compose -f docker-compose.ci.yml up \
            --abort-on-container-exit --exit-code-from backend

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.ci.yml build frontend
      - run: docker compose -f docker-compose.ci.yml run --rm frontend

  docker-publish:
    needs: [test, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cpms-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cpms-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cpms-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/cpms-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
