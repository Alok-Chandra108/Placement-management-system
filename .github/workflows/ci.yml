# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/cpms_test
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars-long
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          FRONTEND_URL: http://localhost:5173
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: 123456789
          CLOUDINARY_API_SECRET: test-secret-key-for-testing-only
          BREVO_API_KEY: xkeysib-test-key
          BREVO_SENDER_EMAIL: test@example.com

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1

  docker-publish:
    needs: [test, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check if Docker Hub credentials are provided in repository secrets
      - name: Check Docker Hub Credentials
        id: docker_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials not configured. Building images without pushing."
          fi

      # Enable QEMU so BuildKit can cross-compile for arm64 on the amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # Initialise BuildKit builder that supports multi-platform manifests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker_check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Build & push backend (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.docker_check.outputs.enabled == 'true' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-backend:latest
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Build & push frontend (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.docker_check.outputs.enabled == 'true' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-frontend:latest
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render deployment..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo -e "\nDeployment triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured. Skipping deploy."
          fi
