# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Isolated containers for mongo + redis with health checks in docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker compose -f docker-compose.ci.yml build backend

      - name: Run tests
        run: |
          docker compose -f docker-compose.ci.yml up \
            --abort-on-container-exit --exit-code-from backend

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.ci.yml build frontend
      - run: docker compose -f docker-compose.ci.yml run --rm frontend

  docker-publish:
    needs: [test, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check if Docker Hub credentials are provided in repository secrets
      - name: Check Docker Hub Credentials
        id: docker_check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "Docker Hub credentials not configured. Building images without pushing."
          fi

      # Enable QEMU so BuildKit can cross-compile for arm64 on the amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # Initialise BuildKit builder that supports multi-platform manifests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker_check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Build & push backend (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.docker_check.outputs.enabled == 'true' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-backend:latest
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Build & push frontend (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.docker_check.outputs.enabled == 'true' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-frontend:latest
            ${{ secrets.DOCKER_USERNAME || 'cpms' }}/cpms-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
