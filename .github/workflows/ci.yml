name: CPMS CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Test Backend
        run: |
          cd backend
          npm install
          npm test

      - name: Install & Test Frontend
        run: |
          cd frontend
          npm install
          npm test

      - name: Build Backend Docker Image
        run: docker build -t cpms-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t cpms-frontend ./frontend
